[workspace]
resolver = "2"
members = ["crates/ekka-backend", "crates/ekka-backend-fakegw", "crates/openshell-proto"]

[workspace.package]
version      = "0.1.3"
edition      = "2021"
rust-version = "1.92"
license      = "Apache-2.0"
authors      = ["EKKA, Inc."]
repository   = "https://github.com/ekka-labs/ekka-backend"

[workspace.dependencies]
# OpenShell's wire types: the prost and tonic versions NVIDIA OpenShell builds them with.
prost             = "0.14"
prost-types       = "0.14"
prost-reflect     = { version = "0.16.5", features = ["serde"] }
tonic             = { version = "0.14", default-features = false, features = ["codegen", "server", "channel"] }
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
protox            = "0.9"
serde_json        = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
