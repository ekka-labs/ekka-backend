name: release

# Publish the adapter image for a version tag (v1.2.3), for linux/amd64 and
# linux/arm64. Each platform is built and smoke tested on a runner of its own
# processor type (nothing is emulated) and pushed by digest. Then one job joins
# the two into a multi-platform index under the tag, signs the index and each
# platform image keyless, attaches each platform's SBOM attestation, and
# verifies all of it with the exact identity an installer pins. An installer
# pins the index digest; docker pulls the image for its own processor type.
# Any error stops the run. If signing fails after the push, the image stays in
# the registry unsigned, and an installer that verifies before it pulls
# refuses it.
#
# Verify a release with:
#   cosign verify \
#     --certificate-identity-regexp '^https://github\.com/ekka-labs/ekka-backend/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/ekka-labs/ekka-backend@sha256:<digest>

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The one place the registry is named.
  REGISTRY: ghcr.io/ekka-labs
  IMAGE_NAME: ekka-backend

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Push to this organization's ghcr with the workflow's own token.
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: The tag is the version Cargo.toml declares
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          [[ "$TAG" == "v$version" ]] || { echo "::error::tag $TAG but Cargo.toml says $version"; exit 1; }

      - name: This runner is the platform it builds
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(docker version --format '{{.Server.Arch}}')" == "$ARCH" ]] \
            || { echo "::error::runner is $(docker version --format '{{.Server.Arch}}'), not $ARCH"; exit 1; }

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: The pushed image is this platform and answers --version with this version
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$REF" == *@sha256:* ]] || { echo "::error::no digest"; exit 1; }
          os_arch="$(docker image inspect "$(docker pull -q "$REF")" --format '{{.Os}}/{{.Architecture}}')"
          [[ "$os_arch" == "$PLATFORM" ]] || { echo "::error::image is $os_arch, not $PLATFORM"; exit 1; }
          out="$(docker run --rm "$REF" --version)"
          echo "$out"
          [[ "$out" == "ekka-backend ${TAG#v} (contract ekka.backend.v1)" ]]

      - uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c  # v0.20.5
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Hand the digest and the SBOM to the publish job
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          echo "$DIGEST" > "out/digest-$ARCH"
          mv "sbom-$ARCH.spdx.json" out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Push the index to this organization's ghcr with the workflow's own token.
      packages: write
      # Keyless signing: a short-lived OIDC token naming THIS workflow run. It
      # grants no repository write; Sigstore certifies the run's identity.
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2
        with:
          cosign-release: 'v2.4.1'

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: image-*
          path: in
          merge-multiple: true

      - name: Join the two platforms into one index under the tag
        id: index
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          amd64="$(cat in/digest-amd64)"; arm64="$(cat in/digest-arm64)"
          for d in "$amd64" "$arm64"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not a digest: $d"; exit 1; }
          done
          docker buildx imagetools create -t "$REPO:$TAG" "$REPO@$amd64" "$REPO@$arm64"
          raw="$(docker buildx imagetools inspect "$REPO:$TAG" --raw)"
          digest="$(docker buildx imagetools inspect "$REPO:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for the index"; exit 1; }
          # The index holds exactly the two images built above, each under its own platform.
          got="$(printf '%s' "$raw" | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' | sort)"
          want="$(printf 'linux/amd64 %s\nlinux/arm64 %s\n' "$amd64" "$arm64" | sort)"
          [[ "$got" == "$want" ]] || { echo "::error::the index is not the two built images"; echo "$got"; exit 1; }
          { echo "index=$REPO@$digest"; echo "amd64=$REPO@$amd64"; echo "arm64=$REPO@$arm64"; } >> "$GITHUB_OUTPUT"

      - name: Sign the index and each platform keyless, attest each SBOM, and verify all of it
        env:
          INDEX: ${{ steps.index.outputs.index }}
          AMD64: ${{ steps.index.outputs.amd64 }}
          ARM64: ${{ steps.index.outputs.arm64 }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for ref in "$INDEX" "$AMD64" "$ARM64"; do
            [[ "$ref" == *@sha256:* ]] || { echo "::error::no digest to sign"; exit 1; }
            cosign sign --yes "$ref"
          done
          cosign attest --yes --type spdxjson --predicate in/sbom-amd64.spdx.json "$AMD64"
          cosign attest --yes --type spdxjson --predicate in/sbom-arm64.spdx.json "$ARM64"
          for ref in "$INDEX" "$AMD64" "$ARM64"; do
            cosign verify --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
          done
          for ref in "$AMD64" "$ARM64"; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
          done
          { echo "published, signed and verified (pin this one): $INDEX"
            echo "  linux/amd64: $AMD64"
            echo "  linux/arm64: $ARM64"; } | tee -a "$GITHUB_STEP_SUMMARY"
