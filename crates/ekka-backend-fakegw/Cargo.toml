[package]
name                 = "ekka-backend-fakegw"
description          = "Test fakes for ekka-backend: an NVIDIA OpenShell gateway and its sign-in service. A dev-dependency only; never in the release image."
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish              = false

[dependencies]
openshell-proto = { path = "../openshell-proto" }
tonic          = { workspace = true }
prost          = { workspace = true }
prost-reflect  = { workspace = true }
tonic-prost    = { workspace = true }
tokio          = { version = "1.52", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
http           = "1"
http-body-util = "0.1.3"
hyper          = { version = "1.9", default-features = false, features = ["server", "http1", "http2"] }
hyper-util     = { version = "0.1.20", default-features = false, features = ["tokio", "server", "service"] }
serde_json     = "1.0.149"
base64         = "0.22.1"
url            = "2"
rcgen          = "0.13"
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tonic          = { workspace = true, features = ["tls-ring"] }
tokio          = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
